            }).addTo(mapObj);

        var checkMap = setInterval(function() {

                    mapObj = window[key];
                    break;
                }

            if (mapObj) {

                mapObj.eachLayer(function(layer) {

                mapObj.on('moveend', function() { updateTop5(mapObj); });
                mapObj.on('zoomend', function() { updateTop5(mapObj); });
                updateTop5(mapObj);
            }
        }, 200);
